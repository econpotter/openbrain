# Non-secret configuration for openbrain.
# API keys and DATABASE_URL go in .env — not here.

# Host-side library path: where scripts/backup.sh (run on the host) finds the
# files. When the server runs inside the Docker container the same files are
# bind-mounted at a different path; set OPENBRAIN_LIBRARY_PATH there to override
# this value (the Dockerfile sets it to /data/openbrain/library).
library_path: /mnt/data/openbrain/library
backup_path: /mnt/data/openbrain/backup
litellm_url: http://litellm:4000

server:
  # Transport: stdio | http
  transport: http
  port: 8000

backup:
  keep_days: 30

ingest:
  staging_path: /tmp/openbrain-ingest
  # Optional SCP host or alias shown by prepare_document_ingest.
  # If omitted, openbrain uses the server hostname.
  staging_host:

embed:
  # Provider: voyage | openrouter | litellm
  provider: litellm
  model: moon8-embeddings
  # No fallback: embeddings must always come from the same model. A different
  # model produces vectors in a different geometry, so cosine similarity across
  # them is meaningless. If the embed model is down, fetch/ingest stores the
  # chunk text with a NULL embedding and the maintenance backfill sweep
  # (backfill_chunk_embeddings) embeds it later, once the model is back up.
  #
  # Task prefixes: nomic-embed-text is trained with asymmetric task prefixes.
  # Stored text (chunks, thoughts, entities) is prefixed with document_prefix;
  # search queries with query_prefix. Leave both empty for providers that take
  # an input_type parameter instead (e.g. voyage, openai). Changing these shifts
  # the vector geometry, so re-embed existing rows after editing them.
  document_prefix: "search_document: "
  query_prefix: "search_query: "
  # Characters kept from the prefixed text before embedding. llama.cpp rejects
  # input longer than nomic's 2048-token context rather than truncating it.
  # 4800 = 2040 tokens x 2.36 chars/token, the lowest ratio measured on stored
  # thoughts, so every text fits. Typical text runs ~3.5 chars/token.
  max_input_chars: 4800

rerank:
  # Cross-encoder reranking of search candidates: cosine retrieves a candidate
  # pool, the reranker reorders it, search returns the top `count`. Served on moon8
  # via the litellm /rerank endpoint. Best-effort — if disabled or the model is
  # unavailable, search falls back to cosine order and never errors.
  enabled: true
  provider: litellm
  model: bge-reranker
  candidates: 30   # how many cosine hits to overfetch before reranking down to count
  timeout: 15

chunk:
  # Body-text chunking for file ingest (fetch_paper stores the abstract as a
  # single chunk and ignores this). Text is split on detected section headings;
  # each section is then divided into even pieces no longer than max_words.
  max_words: 300
  overlap: 50
  # Sections shorter than this merge into the previous kept section, so a stray
  # heading line never becomes its own thin chunk.
  min_section_words: 80
  # Section names (lowercased) excluded from the index — low retrieval value,
  # high noise.
  skip_sections: [references, bibliography, acknowledgments, acknowledgements]

paper_sources:
  # External sources for fetch_paper metadata/abstract lookup. `order` is the
  # fan-out/merge priority; `enabled` filters it. Per-call override: the
  # fetch_paper `sources=` argument.
  order: [openalex, crossref, semantic_scholar, arxiv]
  enabled: [openalex, crossref, semantic_scholar, arxiv]
  # semantic_scholar API key (optional) is read from .env: SEMANTIC_SCHOLAR_API_KEY

extraction:
  # Provider: openrouter | litellm
  # Findings extraction is accuracy-critical and batch (latency-tolerant), so it
  # runs on a cloud model, not the small local moon8-fast (reserved for fast sync
  # agents). Routed through litellm so the OpenRouter key lives only in the proxy.
  # deepseek-v4-flash is cheap + strong at structured JSON; gemini-3.5-flash is the
  # fallback if deepseek returns off-schema.
  provider: litellm
  model: deepseek-v4-flash
  # Structured single-shot extraction: 0.0 for stable, schema-faithful output (no
  # sampling/voting, so randomness is pure downside). Not bit-reproducible (API), but
  # most stable. Raise only if you add multi-sample self-consistency.
  temperature: 0.0
  fallback:
    provider: litellm
    model: gemini-3.5-flash
  run_at: "18:00"
  lookback_hours: 24
  batch_size: 50
  # Fast straggler backstop cadence (openbrain-maintenance.py --sweep-loop). The
  # deferred write-path task normally enriches a thought within seconds; this sweep
  # heals the ones whose model was down at write time. Short so an outage is fixed
  # within minutes, not at the next nightly run_at. Separate schedule from run_at.
  sweep_interval_minutes: 5

judge:
  # Typed per-thought judgments from Jev (TypeSafe System One): an importance
  # Score over the 0-6 levels in brain.IMPORTANCE_LEVELS, and a Choice over the
  # active projects. Jev returns probabilities, not text, so DeepSeek keeps tags,
  # people and action items. Key: TYPESAFE_API_KEY in the environment.
  # Pin the model: the levels and project share were checked against this version.
  model: jev-1.13.0
  # A thought links to the top project in Jev's Choice and to any other project
  # with at least this share of the top probability. Picked from 51 labelled
  # thoughts: 0.3 kept 45 exact project sets and caught second projects that 0.5
  # missed. The raw distribution is stored in metadata.judge, so changing this
  # needs no new Jev calls.
  project_share: 0.3
  # capture_friction stores a user turn when Jev's yes probability for "the
  # user is frustrated with the agent" reaches this. See brain.judge_friction.
  friction_threshold: 0.65
  timeout: 30
