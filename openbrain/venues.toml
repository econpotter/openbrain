# Venue registry seeds. Journals are keyed by issn_l; issn-less venues
# (preprints, working-paper series, reports) by source_id and/or match_names.
# This file seeds the `venues` table at setup; the table auto-grows thereafter
# with origin='discovered' venues. ISSN-L values are the linking ISSN.

