[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbrain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "asyncpg",
    "pgvector",
    "pdfplumber",
    "voyageai",
    "openai",
    "python-dotenv",
    "pyyaml",
    "typer",
    "rich",
    "bibtexparser",
]

[project.scripts]
openbrain-server = "openbrain.server:main"
openbrain-ingest = "openbrain.cli:app"

[tool.setuptools.packages.find]
include = ["openbrain*"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff",
]
